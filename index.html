<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>传讯</title>
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="传讯">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; width:100%; background:#000; overflow:hidden; overscroll-behavior:none; }
  #app { position:fixed; inset:0; width:100%; height:100%; border:0; background:#000; display:block; }
  #splash { position:fixed; inset:0; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:20px; transition:opacity .45s ease; z-index:10; }
  #splash.hide { opacity:0; pointer-events:none; }
  .splash-img { width:88px; height:88px; border-radius:20px; box-shadow:0 0 40px rgba(217,140,166,.25); }
  .splash-tip { color:#d98ca6; font-size:13px; letter-spacing:3px; }
  @keyframes blink { 0%,100%{opacity:.25} 50%{opacity:1} }
  .blink { animation:blink 1.3s infinite; }
  #installBtn { display:none; position:fixed; bottom:calc(28px + env(safe-area-inset-bottom)); left:50%; transform:translateX(-50%); z-index:20; background:#e8a7bc; color:#220f18; border:none; padding:13px 30px; border-radius:999px; font-size:15px; font-weight:700; box-shadow:0 8px 24px rgba(217,140,166,.45); cursor:pointer; }
</style>
</head>
<body>
  <div id="splash">
    <img class="splash-img" src="icon-192.png" alt="">
    <div class="splash-tip">传讯加载中<span class="blink">…</span></div>
  </div>
  <iframe id="app"
    src="https://zunitear.github.io/ZY/"
    allow="clipboard-read; clipboard-write; camera; microphone; autoplay; fullscreen; payment; storage-access-api *"
    allowfullscreen
    loading="eager"></iframe>
  <button id="installBtn">安装为应用</button>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(function (e) { console.log('SW register fail:', e); });
    }
    var f = document.getElementById('app');
    var splash = document.getElementById('splash');
    function hideSplash() { splash.classList.add('hide'); }
    f.addEventListener('load', function () { setTimeout(hideSplash, 300); });
    setTimeout(hideSplash, 8000); // 兜底：8 秒后一定隐藏 loading

    var btn = document.getElementById('installBtn');
    var deferredPrompt = null;
    window.addEventListener('beforeinstallprompt', function (e) {
      e.preventDefault();
      deferredPrompt = e;
      btn.style.display = 'block';
    });
    btn.addEventListener('click', function () {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function () {
          deferredPrompt = null;
          btn.style.display = 'none';
        });
      }
    });
    window.addEventListener('appinstalled', function () { btn.style.display = 'none'; });
  </script>
</body>
</html>
